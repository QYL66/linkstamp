# LinkStamp changes: route admin requests directly to the local aggregation service.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: linkstamp-admin-aggregation
              uri: ${SHORTLINK_AGGREGATION_URL:http://127.0.0.1:8003}
              predicates:
                - Path=/api/short-link/admin/**
              filters:
                - name: TokenValidate
                  args:
                    whitePathList:
                      - /api/short-link/admin/v1/user/login
                      - /api/short-link/admin/v1/user/has-username
