# LinkStamp changes: route admin requests through discovery under the LinkStamp admin service ID.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: linkstamp-admin
              uri: lb://linkstamp-admin/api/short-link/admin/**
              predicates:
                - Path=/api/short-link/admin/**
              filters:
                - name: TokenValidate
                  args:
                    whitePathList:
                      - /api/short-link/admin/v1/user/login
                      - /api/short-link/admin/v1/user/has-username
