# LinkStamp changes: local runtime settings are configurable.
server:
  address: 127.0.0.1
  port: 8000
spring:
  application:
    name: short-link-gateway
  profiles:
    active: aggregation
    # active: dev
  data:
    redis:
      host: ${SHORTLINK_REDIS_HOST:127.0.0.1}
      port: ${SHORTLINK_REDIS_PORT:16380}
  cloud:
    nacos:
      discovery:
        enabled: false
