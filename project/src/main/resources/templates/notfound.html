<!doctype html>
<!-- LinkStamp changes: show a branded unavailable-link page with no external assets. -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>短链接不可用｜链签 LinkStamp</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f7f2;
            color: #17372c;
            font: 16px/1.6 system-ui, sans-serif;
        }
        main { max-width: 32rem; padding: 2rem; }
        h1 { margin: .5rem 0; font-size: clamp(1.8rem, 6vw, 2.6rem); }
        p { margin: 0; }
    </style>
</head>
<body>
    <main>
        <p>链签 LinkStamp</p>
        <h1>短链接不可用</h1>
        <p>请检查链接是否完整，或向分享者索取新的链接。</p>
    </main>
</body>
</html>
